[pytest]
# Collect the pure-Python smoke tests (no R/Julia needed). The numerical
# cross-checks vs the lab's R/Julia live in tests/crosscheck/run_*.py (run via
# tests/crosscheck/run_all.py) and are intentionally NOT collected here, since
# they require an external R/Julia/Quarto toolchain.
testpaths = tests
python_files = test_*.py
addopts = -q --ignore=tests/crosscheck
